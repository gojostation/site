<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редкость карточек</title>
    <style>
        body {
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        
        .container {
            position: relative;
            max-width: 480px;
            width: 100%;
            background: #09090b;
            padding: 40px 25px;
            border-radius: 24px;
            border: 1px solid #1f1f23;
            box-shadow: 0 20px 40px rgba(0,0,0,0.9);
            transition: all 0.3s ease;
        }

        /* Эффект пульсирующей Яндекс Волны */
        .container-shuffling {
            animation: glow-wave 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes glow-wave {
            0% { box-shadow: 0 0 0 0px rgba(255, 255, 255, 0.3), 0 20px 40px rgba(0,0,0,0.9); }
            50% { box-shadow: 0 0 0 25px rgba(255, 255, 255, 0), 0 20px 40px rgba(0,0,0,0.9); }
            100% { box-shadow: 0 0 0 0px rgba(255, 255, 255, 0), 0 20px 40px rgba(0,0,0,0.9); }
        }

        /* Радужная пасхалка awesome */
        .awesome-rainbow {
            animation: rainbow-glow 2s linear infinite !important;
        }

        @keyframes rainbow-glow {
            0% { border-color: #ff0000; box-shadow: 0 0 25px #ff0000; }
            17% { border-color: #ffa500; box-shadow: 0 0 25px #ffa500; }
            33% { border-color: #ffff00; box-shadow: 0 0 25px #ffff00; }
            50% { border-color: #008000; box-shadow: 0 0 25px #008000; }
            67% { border-color: #0000ff; box-shadow: 0 0 25px #0000ff; }
            84% { border-color: #4b0082; box-shadow: 0 0 25px #4b0082; }
            100% { border-color: #ee82ee; box-shadow: 0 0 25px #ee82ee; }
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .site-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #4b5563;
            font-weight: 700;
        }

        /* Кнопка справки */
        .info-btn {
            background: #141417;
            border: 1px solid #27272a;
            color: #a1a1aa;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .info-btn:hover {
            color: #ffffff;
            border-color: #3f3f46;
            background: #1f1f23;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        /* Модальное окно */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background: #0d0d11;
            border: 1px solid #27272a;
            border-radius: 20px;
            padding: 30px;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: left;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 18px;
            background: none;
            border: none;
            color: #71717a;
            font-size: 22px;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .modal-close:hover {
            color: #ffffff;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .modal-subtitle {
            font-size: 13px;
            color: #71717a;
            margin-bottom: 20px;
        }

        .rarity-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .rarity-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #18181b;
            font-size: 15px;
        }

        .rarity-item:last-child {
            border-bottom: none;
        }

        .rarity-name {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        .rarity-chance {
            font-family: monospace;
            font-weight: bold;
            font-size: 15px;
            background: #141417;
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid #27272a;
        }

        .color-common { color: #a1a1aa; }
        .color-rare { color: #3b82f6; }
        .color-epic { color: #a78bfa; }
        .color-mythical { color: #ef4444; }
        .color-legendary { color: #fbbf24; text-shadow: 0 0 10px rgba(251, 191, 36, 0.4); }
        
        h1 { 
            color: #ffffff; 
            margin-bottom: 35px; 
            font-size: 26px; 
            font-weight: 600;
            line-height: 1.3;
        }

        .site-timer-container {
            font-size: 18px;
            font-weight: bold;
            color: #a1a1aa;
            margin: 20px 0;
            padding: 15px;
            border-radius: 12px;
            background: #141417;
            border: 1px solid #27272a;
        }
        .site-timer-clock {
            color: #ffffff;
            font-family: monospace;
            font-size: 24px;
            display: block;
            margin-top: 5px;
        }

        .tgk-timer-container {
            font-size: 16px;
            font-weight: 600;
            color: #a1a1aa;
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            background: #09090b;
            border: 1px dashed #27272a;
        }
        .tgk-timer-clock {
            color: #ffffff;
            font-family: monospace;
            font-size: 20px;
            display: block;
            margin-top: 4px;
        }

        #card-display {
            margin-top: 20px;
            padding: 30px 20px;
            border-radius: 16px;
            background: #020202;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid #18181b;
        }

        .rarity-tag {
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .comment-text { 
            font-size: 18px; 
            color: #a1a1aa; 
        }
        
        /* Стили редкостей */
        .common-style { border-color: #3f3f46 !important; box-shadow: 0 0 15px rgba(63,63,70,0.3); }
        .common-style .rarity-tag { color: #a1a1aa; }
        
        .rare-style { border-color: #2563eb !important; box-shadow: 0 0 20px rgba(37,99,235,0.4); }
        .rare-style .rarity-tag { color: #3b82f6; }
        
        .epic-style { border-color: #7c3aed !important; box-shadow: 0 0 20px rgba(124,58,237,0.5); }
        .epic-style .rarity-tag { color: #a78bfa; }
        
        .mythical-style { border-color: #dc2626 !important; box-shadow: 0 0 25px rgba(220,38,38,0.5); }
        .mythical-style .rarity-tag { color: #ef4444; }

        .legendary-style { 
            border-color: #d97706 !important; 
            box-shadow: 0 0 35px rgba(217,119,6,0.8); 
            animation: pulse 1.2s infinite;
        }
        .legendary-style .rarity-tag { color: #fbbf24; text-shadow: 0 0 15px rgba(251,191,36,0.9); }
        .legendary-style .comment-text { color: #fef08a; font-weight: bold; }

        @keyframes pulse {
            0% { box-shadow: 0 0 20px rgba(217,119,6,0.5); }
            50% { box-shadow: 0 0 40px rgba(217,119,6,0.9); }
            100% { box-shadow: 0 0 20px rgba(217,119,6,0.5); }
        }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <div class="header-top">
            <div class="site-title">Редкость карточек</div>
            <button class="info-btn" id="open-modal-btn" title="Шансы редкостей">?</button>
        </div>
        
        <h1>Рандомный выбор редкости карточек</h1>
        
        <div class="site-timer-container">
            ⏳ До раскрытия редкости дня:
            <span class="site-timer-clock" id="countdown-midnight">00:00:00</span>
        </div>

        <div id="card-display">
            <div class="rarity-tag" id="rarity-text"></div>
            <div class="comment-text" id="comment-text"></div>
            
            <div class="tgk-timer-container" id="tgk-timer-box" style="display: none;">
                ⏳ Карточка будет в ТГК через:
                <span class="tgk-timer-clock" id="countdown-tgk">00:00:00</span>
            </div>
        </div>
    </div>

    <!-- Модальное окно шансов -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-card">
            <button class="modal-close" id="close-modal-btn">&times;</button>
            <div class="modal-title">Вероятности генерации</div>
            <div class="modal-subtitle">Шансы выпадения редкостей в системе:</div>
            
            <ul class="rarity-list">
                <li class="rarity-item color-common">
                    <span class="rarity-name">⚪ Обычная</span>
                    <span class="rarity-chance">35%</span>
                </li>
                <li class="rarity-item color-rare">
                    <span class="rarity-name">🔷 Редкая</span>
                    <span class="rarity-chance">34%</span>
                </li>
                <li class="rarity-item color-epic">
                    <span class="rarity-name">✨ Эпическая</span>
                    <span class="rarity-chance">25%</span>
                </li>
                <li class="rarity-item color-mythical">
                    <span class="rarity-name">💥 Мифическая</span>
                    <span class="rarity-chance">5%</span>
                </li>
                <li class="rarity-item color-legendary">
                    <span class="rarity-name">👑 Легендарная</span>
                    <span class="rarity-chance">1%</span>
                </li>
            </ul>
        </div>
    </div>

    <script>
        const pool = {
            common: [
                "Обычный дроп на сегодня. Базовый исход ⚪💤",
                "Дефолтный выбор системы. Самый частый вариант ⚪🌫️",
                "На сегодня выпал стандартный скромный исход ⚪🔄"
            ],
            rare: [
                "Хороший улов на сегодня, довольно интересный выбор 🔷💎",
                "Редкий результат. Отличный показатель для сегодняшнего дня 🔷😎",
                "Показатели удачи растут. Уверенный синий дроп 🔷⚡"
            ],
            epic: [
                "Высокий результат. Сегодняшний день приносит ЭПИК 🔥",
                "Фиолетовое свечение. Нереальный уровень редкости на сегодня ✨🌌",
                "Превосходный выбор системы. Отличный дроп в карточке ✨🌟"
            ],
            mythical: [
                "Выпал МИФИЧЕСКИЙ ДРОП! Крайне редкое событие в канале 💥💎",
                "Абсолютно топовый результат. На сегодня выпал редчайший Мифик 💥🔥",
                "Шансы были крайне малы, но система выдала Мифик 💥🏆"
            ],
            legendary: [
                "ГЛАВНЫЙ СУПЕР-ПРИЗ! Сгенерирована ЛЕГЕНДАРНАЯ РЕДКОСТЬ 👑✨",
                "Абсолютный максимум. Самый редкий исход во всей системе 👑🏆",
                "Исторический день в канале. Выпала чистая Легендарка 👑🔥"
            ]
        };

        function getSeedBasedRandom() {
            const today = new Date();
            const seedString = "" + today.getFullYear() + today.getMonth() + today.getDate();
            let hash = 0;
            for (let i = 0; i < seedString.length; i++) {
                hash = seedString.charCodeAt(i) + ((hash << 5) - hash);
            }
            return Math.abs(hash) % 100;
        }

        function formatTime(ms) {
            const hours = Math.floor((ms / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((ms / (1000 * 60)) % 60);
            const seconds = Math.floor((ms / 1000) % 60);
            return (hours < 10 ? "0" + hours : hours) + ":" + 
                   (minutes < 10 ? "0" + minutes : minutes) + ":" + 
                   (seconds < 10 ? "0" + seconds : seconds);
        }

        function updateGachaSystem() {
            const container = document.getElementById("main-container");
            const countdownMidnight = document.getElementById("countdown-midnight");
            const countdownTgk = document.getElementById("countdown-tgk");
            const tgkTimerBox = document.getElementById("tgk-timer-box");

            const now = new Date();

            const midnight = new Date();
            midnight.setHours(24, 0, 0, 0); 
            const diffMidnight = midnight - now;
            countdownMidnight.innerText = formatTime(diffMidnight);

            const chance = getSeedBasedRandom();
            revealDailyCard(chance);
            
            container.classList.remove("container-shuffling");

            const targetTgk = new Date();
            targetTgk.setHours(20, 31, 0, 0);

            if (now < targetTgk) {
                tgkTimerBox.style.display = "block";
                const diffTgk = targetTgk - now;
                countdownTgk.innerText = formatTime(diffTgk);
            } else {
                tgkTimerBox.style.display = "none";
            }
        }

        function revealDailyCard(chance) {
            let rarity = "";
            let phraseList = [];
            let cssClass = "";

            if (chance < 1) {
                rarity = "👑 ЛЕГЕНДАРНАЯ РЕДКОСТЬ 👑";
                phraseList = pool.legendary;
                cssClass = "legendary-style";
            } else if (chance < 6) {
                rarity = "💥 МИФИЧЕСКАЯ РЕДКОСТЬ!!! 💥";
                phraseList = pool.mythical;
                cssClass = "mythical-style";
            } else if (chance < 40) {
                rarity = "⚪ ОБЫЧНАЯ РЕДКОСТЬ ⚪";
                phraseList = pool.common;
                cssClass = "common-style";
            } else if (chance < 65) {
                rarity = "✨ ЭПИЧЕСКАЯ РЕДКОСТЬ ✨";
                phraseList = pool.epic;
                cssClass = "epic-style";
            } else {
                rarity = "🔷 РЕДКАЯ РЕДКОСТЬ 🔷";
                phraseList = pool.rare;
                cssClass = "rare-style";
            }

            const phraseIndex = chance % phraseList.length;
            let randomPhrase = phraseList[phraseIndex];

            let display = document.getElementById("card-display");
            
            if (!document.getElementById("main-container").classList.contains("awesome-rainbow")) {
                display.className = "";
                display.classList.add(cssClass);
            }
            
            document.getElementById("rarity-text").innerText = rarity;
            document.getElementById("comment-text").innerText = randomPhrase;
        }

        let inputSecret = "";
        window.addEventListener("keydown", function(e) {
            inputSecret += e.key.toLowerCase();
            if (inputSecret.length > 7) inputSecret = inputSecret.slice(-7);
            
            if (inputSecret === "awesome") {
                const container = document.getElementById("main-container");
                const display = document.getElementById("card-display");
                
                container.className = "container awesome-rainbow";
                display.className = "";
                
                alert("🌈 ПАСХАЛКА АКТИВИРОВАНА! Режим Awesome включен!");
            }
        });

        /* Скрипт управления модальным окном */
        const modalOverlay = document.getElementById("modal-overlay");
        const openModalBtn = document.getElementById("open-modal-btn");
        const closeModalBtn = document.getElementById("close-modal-btn");

        openModalBtn.addEventListener("click", () => {
            modalOverlay.classList.add("active");
        });

        closeModalBtn.addEventListener("click", () => {
            modalOverlay.classList.remove("active");
        });

        modalOverlay.addEventListener("click", (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove("active");
            }
        });

        setInterval(updateGachaSystem, 1000);
        updateGachaSystem();
    </script>
</body>
</html>
